<section class="view-page">
    <div class="view-toolbar">
        <p class="view-subtitle">Gerencie o catálogo e a disponibilidade.</p>
        <button class="btn btn-primary" onclick="window.location.href='/menu/products/add';">
            <i class="bi bi-plus-lg"></i>
            Novo Produto
        </button>
    </div>

    <div class="list-filters mb-3" role="search" aria-label="Filtros de produtos">
        <div class="list-search">
            <input id="productSearch" type="search" class="form-control" placeholder="ID, descrição, categoria ou observação" aria-controls="productTableBody">
        </div>
    </div>

    <div class="table-responsive view-card table-actions-card">
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Categoria</th>
                    <th>Preço</th>
                    <th>Status</th>
                    <th>Observação</th>
                    <th>Criado em</th>
                    <th class="text-end">Ações</th>
                </tr>
            </thead>
            <tbody id="productTableBody"></tbody>
        </table>
    </div>
</section>
