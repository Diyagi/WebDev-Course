<section class="form-page">
    <div class="form-page-header">
        <p class="view-kicker">Cadastros</p>
        <h2 class="view-title">Produto</h2>
        <p class="text-muted mb-0" id="productId"></p>
    </div>

    <form id="productForm" class="form-card" novalidate>
        <div class="mb-3">
            <label for="productDescription" class="form-label">Descrição</label>
            <input type="text" class="form-control" id="productDescription" required>
        </div>

        <div class="mb-3">
            <label for="productCategoryPicker" class="form-label">Categoria</label>
            <input type="hidden" id="productCategory">
            <button type="button" class="form-select text-start" id="productCategoryPicker" aria-haspopup="dialog">
                <span id="productCategoryLabel">Selecione uma categoria</span>
            </button>
        </div>

        <div class="mb-3">
            <label for="productPrice" class="form-label">Preço</label>
            <input
                type="text"
                class="form-control"
                id="productPrice"
                inputmode="numeric"
                autocomplete="off"
                placeholder="R$ 0,00"
                required
            >
        </div>

        <div class="mb-3">
            <label for="productStatus" class="form-label">Status</label>
            <select class="form-select" id="productStatus" required>
                <option value="active" selected>Ativo</option>
                <option value="inactive">Inativo</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="productObservation" class="form-label">Observação</label>
            <textarea class="form-control" id="productObservation" rows="4"></textarea>
        </div>

        <div id="formMessage"></div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> Salvar Produto
            </button>
            <button type="button" class="btn btn-secondary" onclick="history.back()">Cancelar</button>
        </div>
    </form>
</section>
