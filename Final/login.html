<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar | SaberTI</title>
    <script type="module" src="/assets/js/authGuard.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>

  <body>
    <main class="login-page container py-4">
      <section
        class="login-card card border-0 shadow-lg"
        aria-labelledby="login-title"
      >
        <div class="card-body p-4 p-sm-5">
          <div class="text-center mb-4">
            <span class="brand-mark" aria-hidden="true">ST</span>
            <h1 id="login-title" class="h3 mt-3 mb-1 fw-bold">Bem-vindo(a)</h1>
            <p class="text-secondary mb-0">
              Entre com suas credenciais para continuar.
            </p>
          </div>

          <div
            id="credentials-alert"
            class="alert alert-danger d-none"
            role="alert"
            tabindex="-1"
          >
            E-mail ou senha incorretos. Verifique seus dados e tente novamente.
          </div>

          <form id="login-form" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label fw-medium">E-mail</label>
              <input
                type="email"
                class="form-control form-control-lg"
                id="email"
                name="email"
                autocomplete="email"
                required
                autofocus
              />
              <div class="invalid-feedback">Informe um e-mail válido.</div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-medium">Senha</label>
              <div class="input-group input-group-lg password-field">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  autocomplete="current-password"
                  required
                />
                <button
                  id="password-toggle"
                  class="btn btn-outline-secondary password-toggle"
                  type="button"
                  aria-label="Mostrar senha"
                  aria-pressed="false"
                >
                  <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
                <div class="invalid-feedback">Informe sua senha.</div>
              </div>
            </div>

            <button class="btn btn-primary btn-lg w-100" type="submit">
              Entrar
            </button>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="assets/js/login.js"></script>
  </body>
</html>
