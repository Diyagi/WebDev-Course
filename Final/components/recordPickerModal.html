<div
  class="modal fade"
  id="recordPickerModal"
  tabindex="-1"
  aria-labelledby="recordPickerModalTitle"
  aria-hidden="true"
>
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <p class="view-kicker mb-1" id="recordPickerModalKicker">Seleção</p>
          <h2 class="modal-title fs-5" id="recordPickerModalTitle">
            Selecionar
          </h2>
        </div>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Fechar"
        ></button>
      </div>
      <div class="modal-body">
        <label class="form-label" for="recordPickerSearch">Buscar</label>
        <div class="input-group mb-3">
          <span class="input-group-text"
            ><i class="bi bi-search" aria-hidden="true"></i
          ></span>
          <input
            type="search"
            class="form-control"
            id="recordPickerSearch"
            autocomplete="off"
          />
        </div>
        <p class="small text-muted">
          Pressione Enter para selecionar o primeiro resultado.
        </p>
        <div class="table-responsive view-card">
          <table class="table table-hover align-middle">
            <thead>
              <tr id="recordPickerTableHead"></tr>
            </thead>
            <tbody id="recordPickerTableBody"></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancelar
        </button>
      </div>
    </div>
  </div>
</div>
